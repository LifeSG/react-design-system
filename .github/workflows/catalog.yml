name: Component Catalog

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Generate component catalog
        run: npm run generate:catalog
      - name: Verify catalog is up-to-date
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            echo "::error::Component catalog is out of date. Run 'npm run generate:catalog' and commit the changes."
            git diff
            exit 1
          fi
